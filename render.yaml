services:
  - type: web
    name: expensify-api
    runtime: node
    plan: free
    rootDir: expensify/server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://expensify-client.onrender.com

  - type: web
    name: expensify-client
    runtime: static
    rootDir: expensify/client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://expensify-api.onrender.com
